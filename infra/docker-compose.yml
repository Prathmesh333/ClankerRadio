services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clanker
      POSTGRES_USER: clanker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U clanker']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
  api:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://clanker:${POSTGRES_PASSWORD:-local-development-only}@postgres/clanker
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: redis
      ASSET_ROOT: /data/assets
      STUDIO_TOKEN: ${STUDIO_TOKEN:-local-studio-change-before-deploy}
    ports: ['127.0.0.1:8000:8000']
    volumes: [assets:/data/assets]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: { context: .., dockerfile: infra/Dockerfile.api }
    command: rq worker --url redis://redis:6379/0 default
    environment: *api-env
    volumes: [assets:/data/assets]
    depends_on: [api]
  web:
    build: { context: .., dockerfile: infra/Dockerfile.web }
    environment:
      API_URL: http://api:8000
      STUDIO_TOKEN: ${STUDIO_TOKEN:-local-studio-change-before-deploy}
    ports: ['127.0.0.1:3000:3000']
    depends_on: [api]
volumes:
  postgres-data:
  redis-data:
  assets:
