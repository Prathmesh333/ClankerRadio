[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clanker-radio"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "redis>=5,<7", "rq>=2,<3", "mido>=1.3,<2", "numpy>=2,<3", "boto3>=1.35,<2", "PyYAML>=6,<7", "SoundCard>=0.4.5,<0.5; sys_platform == 'win32'", "winrt-Windows.Media.Control>=3.2,<4; sys_platform == 'win32'", "winrt-Windows.Foundation>=3.2,<4; sys_platform == 'win32'", "winrt-Windows.Foundation.Collections>=3.2,<4; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "jsonschema>=4.23,<5", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["apps/api", "packages/music-core", "packages/audio-analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
